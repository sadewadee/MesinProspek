# Local stack (docs/06 §2 `local`): the services of docker-compose.prod.yml built from source, plus caddy
# (docs/README.md) and mailpit (email of the Kratos courier and of invites, docs/05). From the repo root:
#   docker compose -f deploy/docker-compose.local.yml up --build
# App http://localhost:8000 (Caddyfile.local) · Mailpit http://localhost:8025 · Postgres localhost:5432.
# Settings: .env.local.example, overridden by .env.local when present. Start over from the first init:
#   docker compose -f deploy/docker-compose.local.yml down -v

name: msp-local

x-env: &env
  env_file:
    - .env.local.example
    - { path: .env.local, required: false }

x-kratos: &kratos                                   # kratos and kratos-migrate
  <<: *env
  image: oryd/kratos:v26.2.0                        # same version as docker-compose.prod.yml
  depends_on: { postgres: { condition: service_healthy } }

x-app: &app                                         # api, worker and migrate: same image
  <<: *env
  build: ../apps/api                                # same context as the CI build job
  image: msp-local/api
  depends_on:
    postgres: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  volumes: ["storage:/var/lib/msp/storage"]          # MSP_STORAGE_DIR (docs/04 §13)

services:
  caddy:
    image: caddy:2.11.4                             # same version as ops/compose.yaml
    ports: ["127.0.0.1:8000:80"]
    volumes: ["./Caddyfile.local:/etc/caddy/Caddyfile:ro"]
    depends_on: [web, api, kratos]

  web:
    build: { context: .., dockerfile: apps/web/Dockerfile }
    image: msp-local/web
    <<: *env                                        # MSP_KRATOS_PUBLIC_URL: server-side reads of Kratos flows
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"], interval: 5s }

  api:
    <<: *app
    command: ["msp", "api"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"], interval: 5s }

  worker:
    <<: *app
    command: ["msp", "worker"]

  migrate:                                          # one-shot `msp migrate` as msp_owner before api and worker
    <<: *app
    command: ["msp", "migrate"]
    depends_on: { postgres: { condition: service_healthy } }

  kratos-migrate:                                   # one-shot `kratos migrate sql` (role kratos, DSN) before kratos
    <<: *kratos
    command: ["migrate", "sql", "-e", "--yes"]

  kratos:
    <<: *kratos
    # --dev: cookies without Secure on plain-HTTP localhost. The courier sends email to Mailpit.
    command: ["serve", "-c", "/etc/kratos/kratos.yml", "--dev", "--watch-courier"]
    depends_on:
      postgres: { condition: service_healthy }
      kratos-migrate: { condition: service_completed_successfully }
      mailpit: { condition: service_started }
    volumes: ["./kratos:/etc/kratos:ro"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4434/health/ready"], interval: 5s }

  mailpit:
    image: axllent/mailpit:v1.31.2                  # SMTP mailpit:1025 inside the network
    ports: ["127.0.0.1:8025:8025"]                  # web UI

  postgres:
    build: ./postgres                               # postgis/postgis + pgBackRest, as in production
    image: msp-postgres:16
    <<: *env
    ports: ["127.0.0.1:5432:5432"]                  # host-side tools and MSP_TEST_DATABASE_URL
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First init only (empty volume): roles, database msp, extensions, role passwords (docs/04 §4.4)
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro      # = apps/api/db/roles.sql
      - ./postgres/init-msp.sh:/docker-entrypoint-initdb.d/20-msp.sh:ro
    # TCP check: during first init the temporary server listens on the socket only.
    healthcheck: { test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 5s }

volumes:
  pgdata: {}
  storage: {}
