# App stack for staging and production (docs/06-ci-cd.md §5). deploy/deploy.sh copies this file to
# compose.yaml in /opt/msp or /opt/msp-staging, next to .env, kratos/ and postgres/.
# The project name is the directory name, so containers are msp-api-1 or msp-staging-api-1 (Caddyfile).
# Limits = production column of 06 §2; staging overrides them in docker-compose.staging.yml.

x-app: &app                                         # api and worker: same image
  image: ${MSP_IMAGE_REPO:?set MSP_IMAGE_REPO in .env}/api:${MSP_IMAGE_TAG:?set MSP_IMAGE_TAG in .env}
  env_file: .env
  restart: unless-stopped
  depends_on: { postgres: { condition: service_healthy } }
  volumes: ["storage:/var/lib/msp/storage"]          # MSP_STORAGE_DIR: export files (docs/04 §13)

services:
  web:                                              # no env_file: web holds no secrets
    image: ${MSP_IMAGE_REPO:?}/web:${MSP_IMAGE_TAG:?}
    restart: unless-stopped
    environment:                                    # server-side reads of Kratos flows (docs/04 §9)
      MSP_KRATOS_PUBLIC_URL: ${MSP_KRATOS_PUBLIC_URL:?set MSP_KRATOS_PUBLIC_URL in .env}
    networks: [default, edge]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"], interval: 5s }
    deploy: { resources: { limits: { cpus: "1", memory: 2G } } }

  api:
    <<: *app
    command: ["msp", "api"]                         # :8080 via Caddy; metrics :9090 only for Prometheus (edge network)
    networks: [default, edge]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:8080/readyz"], interval: 5s }
    deploy: { resources: { limits: { cpus: "2", memory: 3G } } }

  worker:
    <<: *app
    command: ["msp", "worker"]
    networks: [default, gmaps, edge]                # gmaps -> gmaps-db:5432 (read-only msp_source_ro); edge -> Prometheus scrapes :9090 (no Caddy route)
    stop_grace_period: 60s                          # running River jobs can finish
    deploy: { resources: { limits: { cpus: "4", memory: 6G } } }

  kratos-migrate:                                   # one-shot `kratos migrate sql` as role kratos (DSN); deploy.sh runs it first
    image: oryd/kratos:v26.2.0                      # same version as kratos below
    command: ["migrate", "sql", "-e", "--yes"]
    env_file: .env
    depends_on: { postgres: { condition: service_healthy } }
    deploy: { resources: { limits: { cpus: "0.5", memory: 256M } } }

  kratos:
    image: oryd/kratos:v26.2.0
    # Config: kratos/kratos.yml (deploy.sh copies deploy/kratos/); secrets and DSN from .env. The courier
    # (verification and recovery email) runs inside the server process.
    command: ["serve", "-c", "/etc/kratos/kratos.yml", "--watch-courier", "--sqa-opt-out"]   # no usage telemetry to Ory
    env_file: .env
    environment:
      SERVE_PUBLIC_BASE_URL: ${MSP_PUBLIC_URL:?set MSP_PUBLIC_URL in .env}/.ory/   # Caddy routes /.ory/* here
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      kratos-migrate: { condition: service_completed_successfully }
    volumes: ["./kratos:/etc/kratos:ro"]
    networks: [default, edge]                       # public API :4433 via Caddy /.ory/*; admin :4434 stays internal
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4434/health/ready"], interval: 5s }
    deploy: { resources: { limits: { cpus: "0.5", memory: 512M } } }

  postgres:
    build: ./postgres                               # Postgres 16 + PostGIS + pgBackRest (06 §8)
    image: msp-postgres:16
    # Only the keys postgres reads, not env_file: .env, whose MSP_IMAGE_TAG changes on every deploy and would
    # recreate postgres each time. DB URLs: role passwords at first init (init-msp.sh). Unset keys stay unset.
    environment:
      [POSTGRES_PASSWORD, MSP_DATABASE_URL, MSP_MIGRATE_DATABASE_URL, DSN, PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_STANZA,
       PGBACKREST_PG1_PATH, PGBACKREST_REPO1_PATH, PGBACKREST_REPO1_CIPHER_TYPE, PGBACKREST_REPO1_RETENTION_FULL]
    restart: unless-stopped
    shm_size: 1g
    stop_grace_period: 60s                          # clean shutdown instead of SIGKILL and crash recovery
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pgbackrest:/var/lib/pgbackrest            # local pgBackRest repo (06 §8); empty in staging
      # First init only (empty volume): roles, database msp, extensions, role passwords (docs/04 §4.4)
      - ./postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro      # = apps/api/db/roles.sql
      - ./postgres/init-msp.sh:/docker-entrypoint-initdb.d/20-msp.sh:ro
    # TCP check: during first init the temporary server listens on the socket only, so `msp migrate`
    # must not start yet.
    healthcheck: { test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"], interval: 5s }
    deploy: { resources: { limits: { cpus: "12", memory: 32G } } }

networks:
  edge: { name: "edge-${MSP_ENV:?set MSP_ENV in .env}", external: true }   # created by the /opt/ops stack (06 §2)
  gmaps: { name: gmaps, external: true }                                    # created by the /opt/ops stack, holds gmaps-db

volumes:
  pgdata: {}
  storage: {}
